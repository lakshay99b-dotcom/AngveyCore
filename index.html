<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ANGVEY — AI Partner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%}
body{background:#0D0D0F;color:#F4F4F5;font-family:'Inter',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
.sb::-webkit-scrollbar{width:4px}
.sb::-webkit-scrollbar-track{background:transparent}
.sb::-webkit-scrollbar-thumb{background:#3F3F46;border-radius:99px}
.sb::-webkit-scrollbar-thumb:hover{background:#52525B}
.hero-glow{background:radial-gradient(ellipse 80% 55% at 50% 35%,rgba(139,92,246,.13) 0%,transparent 68%)}
.msg-user{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;border-radius:18px 18px 4px 18px;padding:12px 16px;max-width:80%;margin-left:auto;margin-bottom:12px}
.msg-ai{background:#18181B;color:#E4E4E7;border-radius:18px 18px 18px 4px;padding:12px 16px;max-width:80%;margin-bottom:12px;border:1px solid #27272A}
.sidebar{width:260px;background:#111113;border-right:1px solid #27272A}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.input-area{background:#111113;border-top:1px solid #27272A;padding:16px}
textarea{background:#18181B;border:1px solid #3F3F46;color:#F4F4F5;border-radius:12px;padding:12px;resize:none;width:100%;font-family:inherit}
button{background:#3F3F46;color:#F4F4F5;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500}
button.primary{background:#7c3aed}
button:hover{opacity:0.9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-content{background:#18181B;border:1px solid #3F3F46;border-radius:16px;padding:24px;max-width:480px;width:90%}
.nav-item{padding:10px 16px;cursor:pointer;border-radius:8px;margin:4px 8px}
.nav-item.active{background:#27272A;color:#A78BFA}
.chat-messages{flex:1;overflow-y:auto;padding:24px}
</style>
</head>
<body class="flex h-screen w-full">
<!-- Sidebar -->
<aside class="sidebar flex flex-col">
  <div class="p-4 border-b border-[#27272A]">
    <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-violet-500 bg-clip-text text-transparent">ANGVEY</h1>
    <p class="text-xs text-zinc-500">AI Partner</p>
  </div>
  <nav class="flex-1 py-2">
    <div class="nav-item active" data-view="chat">💬 Chat</div>
    <div class="nav-item" data-view="library">📚 Library</div>
    <div class="nav-item" data-view="news">📰 News</div>
  </nav>
  <div class="p-4 border-t border-[#27272A]">
    <button id="profileBtn" class="w-full">Profile</button>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <!-- Hero / Header -->
  <header class="hero-glow p-6 border-b border-[#27272A]">
    <h2 id="viewTitle" class="text-2xl font-semibold">Chat with ANGVEY</h2>
    <p class="text-zinc-400 text-sm mt-1">Your personal AI partner with web search, voice, and persistent memory.</p>
  </header>

  <!-- Views -->
  <div id="chatView" class="flex-1 flex flex-col">
    <div id="messages" class="chat-messages sb"></div>
    <div class="input-area">
      <div class="flex gap-2 mb-2">
        <button id="attachBtn" title="Attach file">📎</button>
        <button id="micBtn" title="Voice input">🎤</button>
        <button id="searchBtn" title="Web search with Tavily">🔍</button>
        <button id="exportBtn" title="Export chat" class="primary ml-auto">Export MD</button>
      </div>
      <div class="flex gap-2">
        <textarea id="userInput" rows="2" placeholder="Message ANGVEY... (Shift+Enter for newline)"></textarea>
        <button id="sendBtn" class="primary self-end">Send</button>
      </div>
      <input type="file" id="fileInput" class="hide" accept=".txt,.pdf,.md,.json"/>
    </div>
  </div>

  <div id="libraryView" class="hide flex-1 p-6 overflow-y-auto sb">
    <h3 class="text-lg font-semibold mb-4">Prompt Library</h3>
    <div id="libraryList" class="space-y-2"></div>
    <button id="addPromptBtn" class="mt-4 primary">Add Prompt</button>
  </div>

  <div id="newsView" class="hide flex-1 p-6 overflow-y-auto sb">
    <h3 class="text-lg font-semibold mb-4">AI News</h3>
    <div id="newsList">Loading latest AI news...</div>
  </div>
</main>

<!-- Profile Modal -->
<div id="profileModal" class="modal hide">
  <div class="modal-content">
    <h3 class="text-lg font-semibold mb-4">Profile & Settings</h3>
    <label class="block text-sm mb-1">Groq API Key</label>
    <input id="groqKey" type="password" class="w-full mb-3 p-2 bg-[#0D0D0F] border border-[#3F3F46] rounded" placeholder="gsk_..."/>
    <label class="block text-sm mb-1">Tavily API Key</label>
    <input id="tavilyKey" type="password" class="w-full mb-3 p-2 bg-[#0D0D0F] border border-[#3F3F46] rounded" placeholder="tvly-..."/>
    <label class="block text-sm mb-1">Display Name</label>
    <input id="displayName" class="w-full mb-4 p-2 bg-[#0D0D0F] border border-[#3F3F46] rounded" placeholder="Your name"/>
    <div class="flex gap-2">
      <button id="saveProfile" class="primary flex-1">Save</button>
      <button id="closeProfile" class="flex-1">Close</button>
    </div>
  </div>
</div>

<script>
// === ANGVEY AI Partner — Original Base Restored ===
// Features: Sidebar, Profile modal, Hero, Chat, Library, News, File attach, Tavily search, Voice mic, Groq streaming, IndexedDB

const DB_NAME = 'angvey-db';
const DB_VERSION = 1;
let db;

async function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('chats')) {
        database.createObjectStore('chats', { keyPath: 'id', autoIncrement: true });
      }
      if (!database.objectStoreNames.contains('prompts')) {
        database.createObjectStore('prompts', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveChat(messages) {
  const tx = db.transaction('chats', 'readwrite');
  tx.objectStore('chats').add({ messages, timestamp: Date.now() });
}

async function loadLatestChat() {
  return new Promise((resolve) => {
    const tx = db.transaction('chats', 'readonly');
    const store = tx.objectStore('chats');
    const req = store.openCursor(null, 'prev');
    req.onsuccess = () => {
      const cursor = req.result;
      resolve(cursor ? cursor.value.messages : []);
    };
  });
}

// State
let messages = [];
let currentView = 'chat';
let groqKey = localStorage.getItem('angvey-groq') || '';
let tavilyKey = localStorage.getItem('angvey-tavily') || '';
let displayName = localStorage.getItem('angvey-name') || 'User';

// UI refs
const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const micBtn = document.getElementById('micBtn');
const searchBtn = document.getElementById('searchBtn');
const exportBtn = document.getElementById('exportBtn');
const profileBtn = document.getElementById('profileBtn');
const profileModal = document.getElementById('profileModal');
const groqInput = document.getElementById('groqKey');
const tavilyInput = document.getElementById('tavilyKey');
const nameInput = document.getElementById('displayName');
const saveProfile = document.getElementById('saveProfile');
const closeProfile = document.getElementById('closeProfile');
const navItems = document.querySelectorAll('.nav-item');
const chatView = document.getElementById('chatView');
const libraryView = document.getElementById('libraryView');
const newsView = document.getElementById('newsView');
const viewTitle = document.getElementById('viewTitle');

function renderMessages() {
  messagesEl.innerHTML = messages.map(m => `
    <div class="${m.role === 'user' ? 'msg-user' : 'msg-ai'}">
      <div class="text-xs opacity-70 mb-1">${m.role === 'user' ? displayName : 'ANGVEY'}</div>
      <div class="prose prose-invert max-w-none">${marked.parse(m.content)}</div>
    </div>
  `).join('');
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(text, useSearch = false) {
  if (!text.trim()) return;
  messages.push({ role: 'user', content: text });
  renderMessages();
  userInput.value = '';

  let context = '';
  if (useSearch && tavilyKey) {
    try {
      const res = await fetch('https://api.tavily.com/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: tavilyKey, query: text, max_results: 3 })
      });
      const data = await res.json();
      context = '\n\nWeb results:\n' + (data.results || []).map(r => `- ${r.title}: ${r.content}`).join('\n');
    } catch (e) { console.error(e); }
  }

  const aiMsg = { role: 'assistant', content: '' };
  messages.push(aiMsg);
  renderMessages();

  if (!groqKey) {
    aiMsg.content = 'Please set your Groq API key in Profile.';
    renderMessages();
    return;
  }

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${groqKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: 'You are ANGVEY, a helpful AI Partner. Be concise and useful.' + context },
          ...messages.slice(-10).map(m => ({ role: m.role, content: m.content }))
        ],
        stream: true,
        temperature: 0.7
      })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
      for (const line of lines) {
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          aiMsg.content += delta;
          renderMessages();
        } catch {}
      }
    }
  } catch (e) {
    aiMsg.content = 'Error: ' + e.message;
    renderMessages();
  }
  await saveChat(messages);
}

// Event listeners
sendBtn.onclick = () => sendMessage(userInput.value);
userInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(userInput.value); } };

attachBtn.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    messages.push({ role: 'user', content: `[Attached: ${file.name}]\n${reader.result.slice(0, 2000)}` });
    renderMessages();
  };
  reader.readAsText(file);
};

// Voice
let recognition;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    userInput.value = e.results[0][0].transcript;
    micBtn.textContent = '🎤';
  };
  recognition.onend = () => micBtn.textContent = '🎤';
}
micBtn.onclick = () => {
  if (!recognition) { alert('Speech recognition not supported'); return; }
  micBtn.textContent = '🔴';
  recognition.start();
};

searchBtn.onclick = () => sendMessage(userInput.value || 'latest AI news', true);

// Export feature (new)
exportBtn.onclick = () => {
  const md = messages.map(m => `**${m.role === 'user' ? displayName : 'ANGVEY'}:**\n\n${m.content}\n`).join('\n---\n');
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `angvey-chat-${Date.now()}.md`;
  a.click();
};

// Navigation
navItems.forEach(item => {
  item.onclick = () => {
    navItems.forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    currentView = item.dataset.view;
    chatView.classList.toggle('hide', currentView !== 'chat');
    libraryView.classList.toggle('hide', currentView !== 'library');
    newsView.classList.toggle('hide', currentView !== 'news');
    viewTitle.textContent = currentView === 'chat' ? 'Chat with ANGVEY' : currentView === 'library' ? 'Prompt Library' : 'AI News';
    if (currentView === 'news') loadNews();
    if (currentView === 'library') loadLibrary();
  };
});

// Profile
profileBtn.onclick = () => {
  groqInput.value = groqKey;
  tavilyInput.value = tavilyKey;
  nameInput.value = displayName;
  profileModal.classList.remove('hide');
};
closeProfile.onclick = () => profileModal.classList.add('hide');
saveProfile.onclick = () => {
  groqKey = groqInput.value;
  tavilyKey = tavilyInput.value;
  displayName = nameInput.value || 'User';
  localStorage.setItem('angvey-groq', groqKey);
  localStorage.setItem('angvey-tavily', tavilyKey);
  localStorage.setItem('angvey-name', displayName);
  profileModal.classList.add('hide');
  alert('Settings saved locally.');
};

// Library
async function loadLibrary() {
  const list = document.getElementById('libraryList');
  list.innerHTML = '<p class="text-zinc-500">Saved prompts will appear here. Use Add Prompt.</p>';
  // Simple localStorage for demo; IndexedDB ready
  const prompts = JSON.parse(localStorage.getItem('angvey-prompts') || '[]');
  list.innerHTML = prompts.map((p, i) => `<div class="p-3 bg-[#18181B] rounded border border-[#27272A]"><strong>${p.title}</strong><p class="text-sm text-zinc-400">${p.content.slice(0,100)}...</p><button onclick="usePrompt(${i})" class="mt-2 text-xs">Use</button></div>`).join('') || '<p class="text-zinc-500">No prompts yet.</p>';
}
window.usePrompt = (i) => {
  const prompts = JSON.parse(localStorage.getItem('angvey-prompts') || '[]');
  userInput.value = prompts[i].content;
  document.querySelector('[data-view="chat"]').click();
};
document.getElementById('addPromptBtn').onclick = () => {
  const title = prompt('Prompt title:');
  const content = prompt('Prompt content:');
  if (title && content) {
    const prompts = JSON.parse(localStorage.getItem('angvey-prompts') || '[]');
    prompts.push({ title, content });
    localStorage.setItem('angvey-prompts', JSON.stringify(prompts));
    loadLibrary();
  }
};

// News (simple static + optional fetch)
async function loadNews() {
  const el = document.getElementById('newsList');
  el.innerHTML = `
    <div class="p-3 bg-[#18181B] rounded mb-2 border border-[#27272A]">
      <strong>Groq continues rapid growth</strong>
      <p class="text-sm text-zinc-400">Fast inference for open models remains a key advantage in 2026.</p>
    </div>
    <div class="p-3 bg-[#18181B] rounded mb-2 border border-[#27272A]">
      <strong>Agent reliability still the #1 pain point</strong>
      <p class="text-sm text-zinc-400">Production agents fail silently without proper tracing and checkpoints.</p>
    </div>
    <div class="p-3 bg-[#18181B] rounded border border-[#27272A]">
      <strong>Tavily & search APIs mature</strong>
      <p class="text-sm text-zinc-400">Real-time web grounding is now table stakes for AI partners.</p>
    </div>
  `;
}

// Init
(async () => {
  db = await openDB();
  messages = await loadLatestChat();
  if (messages.length === 0) {
    messages.push({ role: 'assistant', content: 'Hello! I am ANGVEY, your AI Partner. Set your API keys in Profile, then start chatting. You can attach files, use voice, or search the web.' });
  }
  renderMessages();
  loadLibrary();
})();
</script>
</body>
</html>
